# Configuracion del servidor FTP.
# Cambie este archivo y luego ejecute: ./reiniciar.sh
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
anonymous_enable=YES
anon_root=/srv/ftp
no_anon_password=YES
local_enable=YES
write_enable=NO
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21102
pasv_address=127.0.0.1
ftpd_banner=FTP de Tienda Opita
