# Servidor vulnerable A PROPOSITO, solo para practicar dentro de su Codespace.
# Los puertos quedan atados a 127.0.0.1: nadie de afuera puede llegar a ellos.
services:
  web:
    build: ./servidor/web
    container_name: lab-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./servidor/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7.2-alpine
    container_name: lab-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./servidor/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  ftp:
    build: ./servidor/ftp
    container_name: lab-ftp
    restart: unless-stopped
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21102:21100-21102"
    volumes:
      - ./servidor/ftp/vsftpd.conf:/etc/vsftpd/vsftpd.conf:ro
