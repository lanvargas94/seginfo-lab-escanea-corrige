# Configuracion del servidor web de Tienda Opita.
# Aqui viven varias de las fallas. Cambie este archivo y luego ejecute: ./reiniciar.sh

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Muestra en cada respuesta la version exacta de nginx
    server_tokens on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Carpeta de copias de seguridad, con listado de archivos activado
    location /backup/ {
        autoindex on;
    }

    # Panel de administracion
    location /admin/ {
        index index.html;
    }
}
